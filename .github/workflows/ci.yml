name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore Aura.sln
      - name: Build
        run: dotnet build Aura.sln -c Release --no-restore
      - name: Diagnose runner line endings
        shell: pwsh
        run: |
          dotnet --info
          Write-Output 'core.autocrlf:'
          git config --get core.autocrlf
          Write-Output 'core.eol:'
          git config --get core.eol
          git ls-files --eol -- tests/unit/Aura.Tests.Unit/UiShellTests.cs tests/integration/Aura.Tests.Integration/BootstrapSmokeTests.cs tests/performance/Aura.Tests.Performance/BootstrapSmokeTests.cs tests/accessibility/Aura.Tests.Accessibility/BootstrapSmokeTests.cs
          $files = @(
            'tests/unit/Aura.Tests.Unit/UiShellTests.cs',
            'tests/integration/Aura.Tests.Integration/BootstrapSmokeTests.cs',
            'tests/performance/Aura.Tests.Performance/BootstrapSmokeTests.cs',
            'tests/accessibility/Aura.Tests.Accessibility/BootstrapSmokeTests.cs'
          )
          foreach ($path in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $crlf = 0; $lf = 0; $cr = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 13) { $cr++; if ($i + 1 -lt $bytes.Length -and $bytes[$i + 1] -eq 10) { $crlf++ } }
              if ($bytes[$i] -eq 10) { $lf++ }
            }
            Write-Output ("EOL_BYTES {0}: bytes={1} CRLF={2} LF={3} CR={4}" -f $path, $bytes.Length, $crlf, $lf, $cr)
          }
      - name: Format
        run: dotnet format Aura.sln --verify-no-changes
      - name: Test
        run: dotnet test Aura.sln -c Release --no-build
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**
            **/obj/Release/**

